name: Build XENOWAVE debug APK
on:
  workflow_dispatch:
  push:
    branches:
      - canary
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install native build tools
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "cmake;3.31.6" "build-tools;35.0.0"

      - name: Build XENOWAVE debug APK and run jvm tests
        run: ./gradlew assembleCoreDebug lintCoreDebug testCoreDebugUnitTest --stacktrace -DskipFormatKtlint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XENOWAVE-core-debug
          path: app/build/outputs/apk/core/debug/*.apk

      - name: Upload validation reports and Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlist-sync-validation
          path: |
            app/schemas/**/21.json
            app/build/reports/tests/testCoreDebugUnitTest/
            app/build/test-results/testCoreDebugUnitTest/
            app/build/reports/lint-results-coreDebug.*
